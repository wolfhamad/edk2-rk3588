name: EDK2-RK3588 Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
      
      - name: Update package manager
        run: sudo apt update
      
      - name: Install required packages
        run: |
          sudo apt install -y \
            git \
            gcc \
            g++ \
            build-essential \
            gcc-aarch64-linux-gnu \
            acpica-tools \
            python3-pyelftools \
            uuid-dev \
            python-is-python3 \
            device-tree-compiler
      
      - name: Clone EDK2-RK3588 repository
        run: |
          git clone https://github.com/MAHDTech/edk2-rk3588 -b feat/orange-pi-5-pro --recursive
          cd edk2-rk3588
      
      - name: Build project
        run: |
          cd edk2-rk3588
          ./build.sh --device orangepi-5pro --release Release
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangepi-5pro-release
          path: edk2-rk3588/Build/
          retention-days: 30
      
      - name: Create release on success
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: edk2-rk3588/Build/**/*
          tag_name: build-${{ github.run_number }}
